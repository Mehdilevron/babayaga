[project]
name = "babayaga"
version = "0.1.0"
description = "Cross-venue arbitrage bot: DEX scanning, automated execution, and MetaTrader 5 hedging"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "web3>=6.15",
]

[project.optional-dependencies]
solana = ["solders>=0.20"]
mt5 = ["MetaTrader5>=5.0.45"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
babayaga = "babayaga.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
